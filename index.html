<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Habitaciones en Valencia</title>
<meta name="description" content="Gemeinsame Wohnungssuche in Valencia — gefiltert, kartiert, bewertet." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<link rel="stylesheet" href="assets/style.css" />
</head>
<body>

<div class="tilebar" aria-hidden="true"></div>

<header class="hero">
  <div class="hero-inner">
    <p class="eyebrow">Búsqueda compartida · Valencia</p>
    <h1>Habitaciones<br>en&nbsp;Valencia</h1>
    <p class="lede">Jede Kachel ein Zimmer, jede Farbe ein Status. Gemeinsam gefiltert, gemeinsam entschieden.</p>
  </div>
  <div class="hero-stats" id="heroStats" aria-live="polite">
    <div class="stat"><span class="stat-num" id="statTotal">–</span><span class="stat-label">Einträge</span></div>
    <div class="stat"><span class="stat-num" id="statShown">–</span><span class="stat-label">Gefiltert</span></div>
    <div class="stat"><span class="stat-num" id="statBarrios">–</span><span class="stat-label">Barrios</span></div>
  </div>
</header>

<main class="layout">

  <aside class="rail" id="rail">
    <div class="rail-head">
      <h2>Filter</h2>
      <button id="resetFilters" class="btn-ghost">Zurücksetzen</button>
    </div>

    <div id="filterBody" class="filter-body">
      <p class="loading-msg" id="filterLoading">Lade Daten …</p>
    </div>
  </aside>

  <section class="map-pane">
    <div id="map"></div>
    <div class="map-toggle-mobile">
      <button id="toggleView" class="btn-tile">Liste anzeigen</button>
    </div>
  </section>

  <section class="list-pane" id="listPane">
    <div id="cards" class="cards">
      <p class="loading-msg">Lade Wohnungen …</p>
    </div>
  </section>

</main>

<footer class="foot">
  <p>Daten aus der gemeinsamen Tabelle · aktualisiert bei jedem Laden</p>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
